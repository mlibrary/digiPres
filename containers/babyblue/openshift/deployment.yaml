apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baby-blue-postgresql-data
  labels:
    app: baby-blue-postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baby-blue-postgresql
  labels:
    app: baby-blue-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baby-blue-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: baby-blue-postgresql
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: envsecret
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/pgsql/data
          env:
            - name: PGDATA
              value: /var/lib/pgsql/data/userdata
          readinessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: baby-blue-postgresql-data


---
apiVersion: v1
kind: Service
metadata:
  name: baby-blue-postgresql
  labels:
    app: baby-blue-postgresql
spec:
  type: ClusterIP
  selector:
    app: baby-blue-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baby-blue
  labels:
    app: baby-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baby-blue
  template:
    metadata:
      labels:
        app: baby-blue
    spec:
      containers:
        - name: baby-blue
          image: ghcr.io/mutanthumb/baby-blue:multi.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: envsecret
          env:
            - name: PGHOST
              value: baby-blue-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: POSTGRESQL_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: POSTGRESQL_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: POSTGRESQL_DATABASE
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  name: baby-blue
  labels:
    app: baby-blue
spec:
  type: ClusterIP
  selector:
    app: baby-blue
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
