apiVersion: apps/v1
kind: Deployment
metadata:
  name: baby-blue
  labels:
    app: baby-blue
spec:
  replicas: 1

  selector:
    matchLabels:
      app: baby-blue

  template:
    metadata:
      labels:
        app: baby-blue

    spec:
      containers:
        - name: baby-blue
          image: ghcr.io/mutanthumb/baby-blue:multi.3
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: SOCIAL_AUTH_GLOBUS_KEY
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: SOCIAL_AUTH_GLOBUS_KEY

            - name: SOCIAL_AUTH_GLOBUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: SOCIAL_AUTH_GLOBUS_SECRET
                  
            - name: SOCIAL_AUTH_GLOBUS_ALLOWED_GROUPS
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: SOCIAL_AUTH_GLOBUS_ALLOWED_GROUPS

            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DJANGO_SECRET_KEY

            - name: DJANGO_SETTINGS_MODULE
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DJANGO_SETTINGS_MODULE

            - name: SEARCH_INDEXES_UUID_BBINDEX
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: SEARCH_INDEXES_UUID_BBINDEX

            - name: DJANGO_ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DJANGO_ALLOWED_HOSTS

            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DEBUG

            - name: DJANGO_LOGLEVEL
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DJANGO_LOGLEVEL

            - name: DATABASE_ENGINE
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DATABASE_ENGINE

            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: POSTGRESQL_DATABASE

            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: POSTGRESQL_USER

            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: POSTGRESQL_PASSWORD

            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DATABASE_HOST

            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: envsecret
                  key: DATABASE_PORT

            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

            - name: PYTHONUNBUFFERED
              value: "1"

            - name: HOME
              value: "/tmp"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: baby-blue
  labels:
    app: baby-blue
spec:
  selector:
    app: baby-blue
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: baby-blue
  labels:
    app: baby-blue
spec:
  to:
    kind: Service
    name: baby-blue
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect